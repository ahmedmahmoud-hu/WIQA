name: wiqa
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  

  intl: ^0.20.2
  flutter_svg: ^2.3.0
  video_player: ^2.9.2
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  flutter_map: ^6.1.0 # أو أحدث إصدار
  latlong2: ^0.9.0
  exif: ^3.1.4
  geolocator: ^14.0.2
  url_launcher: ^6.3.0
  get_thumbnail_video: ^0.7.3

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:

  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    #- assets/videos/

flutter_native_splash:
  color: "#0A192F"
  image: assets/images/logo.png # مسار اللوجو الخاص بك
  android_12:
    image: assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
